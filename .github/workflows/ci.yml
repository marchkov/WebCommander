name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # HTTP startup tests require the built frontend.
      - run: npm run build
      - name: Backend and frontend/helper tests, including native PTY
        run: node --test server/*.test.js server/providers/*.test.js server/services/*.test.js tests/*.test.cjs
        env:
          WC_TEST_REAL_PTY: '1'
